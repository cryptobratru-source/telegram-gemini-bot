services:
  - type: worker
    name: telegram-gemini-bot
    runtime: python
    plan: free
    repo: https://github.com/cryptobratru-source/telegram-gemini-bot
    branch: master
    buildCommand: pip install -r requirements.txt
    startCommand: python telegram_gemini_bot.py
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: "3.12"
